basePath: /api/v1
definitions:
  domain.TaskStatus:
    enum:
    - todo
    - in_progress
    - done
    type: string
    x-enum-varnames:
    - TaskStatusTodo
    - TaskStatusInProgress
    - TaskStatusDone
  handler.PaginatedResponse-handler_taskResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handler.taskResponse'
        type: array
      hasMore:
        type: boolean
      nextCursor:
        type: string
    type: object
  handler.ProblemDetails:
    properties:
      detail:
        type: string
      errors:
        items:
          $ref: '#/definitions/validator.ValidationError'
        type: array
      instance:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  handler.createTaskRequest:
    properties:
      project_id:
        type: string
      title:
        maxLength: 200
        minLength: 3
        type: string
    required:
    - project_id
    - title
    type: object
  handler.createUserRequest:
    properties:
      email:
        type: string
      name:
        maxLength: 100
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  handler.healthResponse:
    properties:
      status:
        type: string
      version:
        type: string
    type: object
  handler.taskResponse:
    properties:
      assignee_id:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      description:
        type: string
      id:
        type: string
      project_id:
        type: string
      status:
        $ref: '#/definitions/domain.TaskStatus'
      title:
        type: string
      updated_at:
        type: string
    type: object
  handler.userResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
    type: object
  validator.ValidationError:
    properties:
      field:
        type: string
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API REST for project management
  title: Devboard API
  version: "1.0"
paths:
  /health:
    get:
      description: Verify that server is running and accepting requests
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.healthResponse'
      summary: Health check
      tags:
      - system
  /projects/{id}/tasks:
    get:
      description: Returns all tasks that belongs to a project
      parameters:
      - description: Project ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.PaginatedResponse-handler_taskResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: List all tasks from a project
      tags:
      - tasks
  /tasks:
    post:
      consumes:
      - application/json
      description: Create a new task
      parameters:
      - description: Task data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.taskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: Create task
      tags:
      - tasks
  /tasks/{id}:
    get:
      description: Retrieve a task by its ID
      parameters:
      - description: task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.taskResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: Retrieve task by ID
      tags:
      - tasks
  /users:
    post:
      consumes:
      - application/json
      description: Register new user
      parameters:
      - description: User data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handler.userResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: Create user
      tags:
      - users
  /users/{id}:
    get:
      description: Get user by Id
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.userResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handler.ProblemDetails'
      summary: Get user
      tags:
      - users
swagger: "2.0"
